# ============================================================
# Nginx config cho Camera NOC Dashboard (Production)
# Đặt tại /etc/nginx/nginx.conf khi deploy không dùng Docker
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # --------------------------------------------------
        # Proxy WebSocket: /api/events/ws → backend
        # QUAN TRỌNG: Phải xử lý WebSocket trước /api chung
        # --------------------------------------------------
        location /api/events/ws {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;

            # Headers bắt buộc cho WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeout dài hơn cho WebSocket long-lived connection
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --------------------------------------------------
        # Proxy REST API: /api/* → FastAPI backend
        # --------------------------------------------------
        location /api {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # --------------------------------------------------
        # SPA Fallback: tất cả route khác → index.html
        # Để React Router hoạt động khi refresh trang
        # --------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
